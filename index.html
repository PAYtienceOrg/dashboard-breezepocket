<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f4436" />
    <title>PAYtience | Get paid while you wait</title>
    <script>
      // Set the theme before the first paint, so a dark-mode visitor never sees a light flash.
      // The saved choice wins; without one the system setting decides. Mirrors src/lib/theme.ts.
      try {
        var t = localStorage.getItem('paytience.theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (/^\/vaults?(\/|$)/.test(location.pathname)) t = 'vault'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
